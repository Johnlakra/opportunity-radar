# The runtime team. One job each, own schedule, failures isolated.
# Order matters only for the staggered first run after boot (regime first).
agents:
  regime:                       # BTC regime from the cheat sheet; feeds scout/majors gating
    type: regime
    every_min: 240
  guardian:                     # protects your journaled holdings (take-profit, community loss)
    type: guardian
    every_min: 30
    take_profit_multiples: [2, 3, 5, 10]
    drawdown_alert_pct: 30
  reminders:                    # sends the ⏰ reminders you set from the buttons
    type: reminders
    every_min: 10
    max_per_run: 10
  news_ai:
    type: news
    topic: ai
    label: "AI"
    every_min: 15                 # only new, pre-filtered stories reach Gemini, so this stays cheap
    score_threshold: 7
    max_age_hours: 24             # older than this when first seen = stale, dropped before scoring
  news_crypto:
    type: news
    topic: crypto_news
    label: "Crypto"
    every_min: 15
    score_threshold: 7
    max_age_hours: 12
  news_airdrops:
    type: news
    topic: airdrops
    label: "Airdrops"
    every_min: 60
    score_threshold: 7
    priority_boost: 3
    max_age_hours: 72             # airdrop posts stay actionable for days
  majors:                       # discounted top-200 coins, only when the regime allows buying
    type: majors
    every_min: 720
    rank_max: 200
    min_ath_drawdown_pct: 70
    max_per_run: 3
  token_scout:                  # multi-chain DEX tokens through the course checklist
    type: token_scout
    every_min: 120
    # Only chains with a free safety report can be crawled (see SCOUT_CHAINS in
    # app/crypto/chains.py). Each extra chain costs ~2 GeckoTerminal calls per run.
    chains: [solana, base, ethereum, bsc, arbitrum]
    shadow_mode: true           # log verdicts only; set false after ~4 weeks if /more shows it's useful
  bulletin:                     # hourly roundup of the best waiting news, one message per topic
    type: bulletin
    every_min: 60
    active_hours: [7, 23]       # your timezone; outside these it waits (instant pings still go out)
    per_topic: 5
    min_priority: 65            # starting bar; it rises when the day runs busy, eases when quiet
    target_per_day: 30
  curator:                      # daily digest: top items across ALL agents, max 2 per topic
    type: curator
    cron_hour: 9
    total: 6
    per_topic: 2
    min_priority: 60
  level_watch:                  # gold/silver (₹) + journal/any crypto: breaks of prev W/M/Q/Y high/low
    type: level_watch
    every_min: 15
    metals_periods: "WMQY"
    journal_periods: "MQY"      # weekly breaks on small caps are noisy; enable W per coin in /alerts
    buffer_pct: {metal: 0.1, cg: 0.5, dex: 1.0}
    priority: {W: 95, M: 95, Q: 95, Y: 95}
    inr_premium_pct: 0          # e.g. 9 to approximate MCX/jeweller (duty+GST); display only
    bootstrap_silver_from_yahoo: true
